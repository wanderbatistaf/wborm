[project]
name = "wborm"
version = "0.4.0"
description = "ORM leve com introspecção automática para bancos JDBC como Informix, usando integração com wbjdbc."
readme = "README.md"
authors = [
  { name = "Wanderson Batista", email = "wanderfreitasb@gmail.com" }
]
license = "MIT"
requires-python = ">=3.8"
dependencies = [
  "wbjdbc>=1.1.3",
  "tabulate",
  "termcolor",
  "cryptography",
  "tqdm"
]
keywords = ["ORM", "JDBC", "Informix", "DB2", "Firebird", "introspecção", "wbjdbc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "black>=23.0",
  "flake8>=6.0",
  "mypy>=1.0",
  "isort>=5.12"
]
pandas = ["pandas"]
spark = ["pyspark"]
api = ["fastapi>=0.110", "pydantic>=2.0"]
docs = [
  "mkdocs>=1.5",
  "mkdocs-material>=9.5,<9.7",
  "mkdocs-static-i18n>=1.2"
]

[project.urls]
Homepage = "https://github.com/wanderbatistaf/wborm"
Documentation = "https://wanderbatistaf.github.io/wborm"
Repository = "https://github.com/wanderbatistaf/wborm"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wborm*"]
