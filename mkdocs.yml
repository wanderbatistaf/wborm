site_name: WBORM
site_description: ORM leve com suporte a JDBC e Informix
site_author: Wanderson Batista
site_url: https://wanderbatistaf.github.io/wborm/

repo_name: wanderbatistaf/wborm
repo_url: https://github.com/wanderbatistaf/wborm
edit_uri: edit/main/docs/
exclude_docs: |
  README.md

theme:
  name: material
  language: pt
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - toc.integrate
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  icon:
    repo: fontawesome/brands/github
  favicon: images/wborm.png
  logo: images/wborm.png

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - i18n:
      languages:
        - locale: pt
          name: Português
          default: true
          build: true
        - locale: en
          name: English
          build: true

nav:
  - Inicio: index.md
  - Fundamentos:
      - Modelos: modelos.md
      - Exemplos: exemplos.md
      - Por que usar: por-que-usar.md
  - Integracoes:
      - WBJDBC: integra-wbjdbc.md
      - Informix: informix_integration.md
      - FastAPI em producao: fastapi_production_guide.md
  - Recursos Avancados:
      - Cache: cache_configuration.md
      - Exemplos avancados: performance_examples.md
      - Conexao global: global_connection_guide.md
      - Multi-database: multi_database_support.md
  - Projeto:
      - Testes: testing.md
      - Changelog: changelog.md

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - footnotes
  - attr_list
  - def_list
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wanderbatistaf

